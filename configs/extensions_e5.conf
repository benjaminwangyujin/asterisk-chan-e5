;
; extensions_e5.conf — chan_e5 拨号计划样例
; 在主 extensions.conf 里 include：
;   #include "extensions_e5.conf"
; 分机/上下文名请按实际 chan_pjsip 配置调整。
;

; ---------------------------------------------------------------------------
; 蜂窝来电：由 e5.conf 的 context 指向这里。
; 来电通道的 exten 是来电号码（如 18751886301，可能带 + 前缀），故除 s 外
; 还需 _X. / _+X. 通配规则，否则会 "invalid extension but no invalid handler"。
; ---------------------------------------------------------------------------
[from-e5-sim1]
exten => s,1,NoOp(蜂窝来电 SIM1: ${CALLERID(num)})
 same => n,Dial(PJSIP/70,30)
 same => n,Hangup()
exten => _X.,1,NoOp(蜂窝来电 SIM1: ${CALLERID(num)})
 same => n,Dial(PJSIP/70,30)
 same => n,Hangup()
exten => _+X.,1,NoOp(蜂窝来电 SIM1: ${CALLERID(num)})
 same => n,Dial(PJSIP/70,30)
 same => n,Hangup()

[from-e5-sim2]
exten => s,1,NoOp(蜂窝来电 SIM2: ${CALLERID(num)})
 same => n,Dial(PJSIP/71,30)
 same => n,Hangup()
exten => _X.,1,NoOp(蜂窝来电 SIM2: ${CALLERID(num)})
 same => n,Dial(PJSIP/71,30)
 same => n,Hangup()
exten => _+X.,1,NoOp(蜂窝来电 SIM2: ${CALLERID(num)})
 same => n,Dial(PJSIP/71,30)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; SIP 分机外呼：9+号码 -> SIM1，8+号码 -> SIM2（Dial 到 E5/<slot>/<号码>）
; ---------------------------------------------------------------------------
[from-internal]
exten => _9X.,1,Dial(E5/1/${EXTEN:1},60)
exten => _8X.,1,Dial(E5/2/${EXTEN:1},60)

; ---------------------------------------------------------------------------
; CLI "e5 call sim1 <号码>" 的呼叫规则：外呼建立后转接到分机 70
; 可在同一上下文用 ${EXTEN} 分支做更复杂路由（按被叫号码/时间段等）。
; ---------------------------------------------------------------------------
[e5-outbound]
exten => _X.,1,NoOp(E5 主动外呼 ${EXTEN})
 same => n,Dial(PJSIP/70,60)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; 短信接收事件：e5.conf 的 sms_context 指向这里，exten => s
; 可用变量：SMS_FROM / SMS_TEXT / SMS_TS / SMS_PATH
; ---------------------------------------------------------------------------
[e5-sms-in]
exten => s,1,NoOp(收到短信 ${SMS_FROM}: ${SMS_TEXT})
 same => n,Gosub(handle-sms,s,1)
 same => n,Hangup()

[handle-sms]
exten => s,1,NoOp(短信处理入口)
 ; 示例：转给 HTTP 网关脚本
 ; same => n,System(/usr/local/bin/e5-sms-hook "${SMS_FROM}" "${SMS_TEXT}")
 ; 示例：回复确认短信
 ; same => n,E5SendSMS(${SMS_FROM},已收到)
 same => n,Return()

; ---------------------------------------------------------------------------
; 短信发送（拨号计划侧）：在任意上下文用 E5SendSMS 应用
; ---------------------------------------------------------------------------
[e5-sms-out]
exten => _X.,1,E5SendSMS(${EXTEN},${MESSAGE})   ; 配合 MESSAGE 变量/Set()
