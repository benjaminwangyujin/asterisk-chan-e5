;
; e5.conf — chan_e5 配置
;
; 音频端点（实机双向验证）：
;   capture_dev  = hw:0,9   (FE_ST_VOICE_C)     下行：对端语音 -> Asterisk
;   playback_dev = hw:0,18  (FE_ST_VOICE_PCM_P) 上行：Asterisk -> 对端
; 由 e5-tap-up/down 脚本负责接通 S_VOICE_CAP_C / S_VOICE_PCM_P 两个 SWITCH
; 与 DSP 模式控件；chan_e5 只在 active 后 open 上述 PCM 设备。
; 两个设备都不填 -> chan_e5 工作在“信令态”（无语音桥，仅状态/挂断可用）。
; 采样率按方向独立：capture_rate=下行 hw:0,9，playback_rate=上行 hw:0,18。
; 两者可不同（实机：上行 tap 固定 16k，下行 tap 固定 8k）。缺省回退到 rate。
; 音频 dump（诊断用，默认关闭）：dump_capture / dump_playback = yes 时分别把
; 下行/上行原始 PCM 写到 /tmp/e5_cap_2down_dump.raw、/tmp/e5_cap_2up_dump.raw。

[general]
; 短信接收事件注入的拨号计划上下文（exten => s 处理）
sms_context = e5-sms-in
; CLI "e5 call sim1 <号码>" 的呼叫规则上下文
call_context = e5-outbound
; 短信进拨号计划后是否删除 SIM 卡上的 SMS 对象（防存满丢新短信）
sms_delete_after = yes
; DSP 带宽联动文件（内容 0=NB 8000Hz, 1=WB 16000Hz）；无此文件则不联动
band_file = /run/e5-voice-audio-tap/band

[sim1]
context = from-e5-sim1
; group = gsm-1
capture_rate = 8000    ; 下行 hw:0,9
playback_rate = 16000  ; 上行 hw:0,18
; dump_capture = no     ; yes=下行采集 dump 到 /tmp/e5_cap_2down_dump.raw
; dump_playback = no    ; yes=上行注入 dump 到 /tmp/e5_cap_2up_dump.raw
rxgain = 100
txgain = 100
capture_dev = hw:0,9
playback_dev = hw:0,18
route_up = /usr/libexec/asterisk/e5-tap-up
route_down = /usr/libexec/asterisk/e5-tap-down

[sim2]
context = from-e5-sim2
; group = gsm-2
capture_rate = 8000    ; 下行 hw:0,9
playback_rate = 16000  ; 上行 hw:0,18
; dump_capture = no     ; yes=下行采集 dump 到 /tmp/e5_cap_2down_dump.raw
; dump_playback = no    ; yes=上行注入 dump 到 /tmp/e5_cap_2up_dump.raw
rxgain = 100
txgain = 100
capture_dev = hw:0,9
playback_dev = hw:0,18
route_up = /usr/libexec/asterisk/e5-tap-up
route_down = /usr/libexec/asterisk/e5-tap-down
